<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Structures — Interactive Reference</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Syne:wght@400;600;700&display=swap"
        rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #ffffff;
            --surface: #f7f6f3;
            --border: rgba(0, 0, 0, 0.1);
            --border-strong: rgba(0, 0, 0, 0.2);
            --text: #1a1a18;
            --muted: #6b6b65;
            --mono: 'JetBrains Mono', monospace;
            --sans: 'Syne', sans-serif;
            --radius: 10px;
            --radius-sm: 6px;
            --c-blue-bg: #e6f1fb;
            --c-blue-text: #185fa5;
            --c-green-bg: #eaf3de;
            --c-green-text: #3b6d11;
            --c-amber-bg: #faeeda;
            --c-amber-text: #854f0b;
            --c-red-bg: #fcebeb;
            --c-red-text: #a32d2d;
            --c-gray-bg: #f1efe8;
            --c-gray-text: #5f5e5a;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1a1a18;
                --surface: #242422;
                --border: rgba(255, 255, 255, 0.1);
                --border-strong: rgba(255, 255, 255, 0.2);
                --text: #e8e7e0;
                --muted: #9c9a92;
                --c-blue-bg: #042c53;
                --c-blue-text: #85b7eb;
                --c-green-bg: #173404;
                --c-green-text: #97c459;
                --c-amber-bg: #412402;
                --c-amber-text: #ef9f27;
                --c-red-bg: #501313;
                --c-red-text: #f09595;
                --c-gray-bg: #2c2c2a;
                --c-gray-text: #b4b2a9;
            }
        }

        html,
        body {
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: var(--sans);
            font-size: 14px;
        }

        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            padding: 18px 28px;
            border-bottom: 0.5px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--surface);
        }

        header h1 {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        header span {
            font-size: 12px;
            color: var(--muted);
            font-weight: 400;
        }

        .layout {
            display: grid;
            grid-template-columns: 200px 1fr;
            flex: 1;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            border-right: 0.5px solid var(--border);
            background: var(--surface);
            padding: 12px 0;
            display: flex;
            flex-direction: column;
            gap: 2px;
            overflow-y: auto;
        }

        .sidebar-title {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: var(--muted);
            padding: 4px 16px 10px;
        }

        .ds-btn {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 8px 16px;
            cursor: pointer;
            border: none;
            background: none;
            text-align: left;
            width: 100%;
            font-family: var(--sans);
            font-size: 13px;
            font-weight: 400;
            color: var(--muted);
            transition: background .15s, color .15s;
        }

        .ds-btn:hover {
            background: var(--bg);
            color: var(--text);
        }

        .ds-btn.active {
            background: var(--bg);
            color: var(--text);
            font-weight: 600;
        }

        .ds-btn .icon {
            width: 24px;
            height: 24px;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 600;
            flex-shrink: 0;
            font-family: var(--mono);
        }

        .icon-blue {
            background: var(--c-blue-bg);
            color: var(--c-blue-text);
        }

        .icon-green {
            background: var(--c-green-bg);
            color: var(--c-green-text);
        }

        .icon-amber {
            background: var(--c-amber-bg);
            color: var(--c-amber-text);
        }

        /* Main content */
        .main {
            padding: 24px 28px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 18px;
            background: var(--bg);
        }

        /* Header block */
        .ds-name {
            font-size: 24px;
            font-weight: 700;
            line-height: 1.1;
        }

        .ds-tagline {
            font-size: 13px;
            color: var(--muted);
            margin-top: 5px;
        }

        .tag-row {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            border-radius: 20px;
            padding: 3px 10px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: .03em;
        }

        .badge-blue {
            background: var(--c-blue-bg);
            color: var(--c-blue-text);
        }

        .badge-amber {
            background: var(--c-amber-bg);
            color: var(--c-amber-text);
        }

        .badge-green {
            background: var(--c-green-bg);
            color: var(--c-green-text);
        }

        .divider {
            width: 100%;
            height: 0.5px;
            background: var(--border);
        }

        .section-title {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 2px;
        }

        /* Complexity grid */
        .complexity-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .complexity-card {
            background: var(--surface);
            border: 0.5px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 10px 12px;
        }

        .complexity-label {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 4px;
        }

        .complexity-val {
            font-size: 15px;
            font-weight: 600;
            font-family: var(--mono);
        }

        .c-green {
            color: var(--c-green-text);
        }

        .c-blue {
            color: var(--c-blue-text);
        }

        .c-amber {
            color: var(--c-amber-text);
        }

        .c-red {
            color: var(--c-red-text);
        }

        .c-muted {
            color: var(--muted);
        }

        /* Viz area */
        .viz-area {
            border: 0.5px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface);
            padding: 18px 16px 14px;
            min-height: 150px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .viz-controls {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            margin-top: 4px;
        }

        .viz-btn {
            border: 0.5px solid var(--border-strong);
            background: var(--bg);
            border-radius: var(--radius-sm);
            padding: 6px 13px;
            font-size: 12px;
            cursor: pointer;
            font-family: var(--sans);
            color: var(--text);
            transition: background .15s;
            font-weight: 500;
        }

        .viz-btn:hover {
            background: var(--surface);
        }

        .viz-input {
            border: 0.5px solid var(--border-strong);
            background: var(--bg);
            border-radius: var(--radius-sm);
            padding: 6px 10px;
            font-size: 12px;
            width: 72px;
            font-family: var(--mono);
            color: var(--text);
            text-align: center;
            outline: none;
        }

        .viz-input:focus {
            border-color: var(--c-blue-text);
        }

        .viz-label {
            font-size: 11px;
            color: var(--muted);
            text-align: center;
        }

        /* Array */
        .node-row {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }

        .array-cell {
            width: 46px;
            height: 46px;
            border: 0.5px solid var(--border-strong);
            border-right: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
            font-family: var(--mono);
            background: var(--bg);
            transition: background .2s, color .2s;
            position: relative;
            cursor: pointer;
        }

        .array-cell:first-child {
            border-radius: 6px 0 0 6px;
        }

        .array-cell:last-child {
            border-radius: 0 6px 6px 0;
            border-right: 0.5px solid var(--border-strong);
        }

        .array-cell .idx {
            position: absolute;
            bottom: 3px;
            font-size: 9px;
            font-weight: 400;
            color: var(--muted);
            font-family: var(--mono);
        }

        .array-cell.highlight {
            background: var(--c-blue-bg);
            color: var(--c-blue-text);
        }

        .array-cell.new-item {
            background: var(--c-green-bg);
            color: var(--c-green-text);
        }

        /* Linked list */
        .ll-row {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0;
        }

        .ll-node {
            display: flex;
            align-items: center;
        }

        .ll-box {
            width: 54px;
            height: 44px;
            border: 0.5px solid var(--border-strong);
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 600;
            font-family: var(--mono);
            background: var(--bg);
            position: relative;
            cursor: pointer;
            transition: background .2s, color .2s;
        }

        .ll-box .ptr {
            position: absolute;
            bottom: 3px;
            font-size: 9px;
            color: var(--muted);
        }

        .ll-box.highlight {
            background: var(--c-blue-bg);
            color: var(--c-blue-text);
        }

        .ll-arrow {
            width: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--muted);
            font-size: 15px;
        }

        /* Stack */
        .stack-col {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stack-top-label {
            font-size: 10px;
            color: var(--muted);
            letter-spacing: .06em;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .stack-cell {
            width: 90px;
            height: 36px;
            border: 0.5px solid var(--border-strong);
            border-bottom: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 600;
            font-family: var(--mono);
            background: var(--bg);
            transition: all .2s;
        }

        .stack-cell:first-child {
            border-radius: 6px 6px 0 0;
        }

        .stack-cell:last-child {
            border-radius: 0 0 6px 6px;
            border-bottom: 0.5px solid var(--border-strong);
        }

        .stack-cell.top-item {
            background: var(--c-amber-bg);
            color: var(--c-amber-text);
        }

        /* Queue */
        .queue-row {
            display: flex;
            align-items: center;
        }

        .queue-cell {
            width: 54px;
            height: 42px;
            border: 0.5px solid var(--border-strong);
            border-right: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 600;
            font-family: var(--mono);
            background: var(--bg);
            transition: all .2s;
            position: relative;
        }

        .queue-cell:first-child {
            border-radius: 6px 0 0 6px;
            background: var(--c-green-bg);
            color: var(--c-green-text);
        }

        .queue-cell:last-child {
            border-radius: 0 6px 6px 0;
            border-right: 0.5px solid var(--border-strong);
            background: var(--c-amber-bg);
            color: var(--c-amber-text);
        }

        .queue-cell .qlabel {
            font-size: 9px;
            position: absolute;
            bottom: 3px;
            color: var(--muted);
        }

        /* Hashmap */
        .hm-grid {
            display: flex;
            flex-direction: column;
            gap: 4px;
            width: 100%;
            max-width: 420px;
        }

        .hm-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .hm-bucket-label {
            width: 20px;
            font-size: 10px;
            color: var(--muted);
            font-family: var(--mono);
            text-align: right;
            flex-shrink: 0;
        }

        .hm-bucket {
            flex: 1;
            min-height: 30px;
            border: 0.5px solid var(--border);
            border-radius: 5px;
            background: var(--bg);
            display: flex;
            gap: 5px;
            padding: 4px 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .hm-item {
            background: var(--c-blue-bg);
            color: var(--c-blue-text);
            border-radius: 4px;
            padding: 2px 8px;
            font-size: 11px;
            font-family: var(--mono);
            font-weight: 500;
        }

        .hm-item.new-item {
            background: var(--c-green-bg);
            color: var(--c-green-text);
        }

        /* When to use / avoid */
        .when-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .when-card {
            border: 0.5px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 12px 14px;
        }

        .when-card.use {
            background: var(--c-green-bg);
        }

        .when-card.avoid {
            background: var(--c-red-bg);
        }

        .when-card-title {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: .08em;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .when-card.use .when-card-title {
            color: var(--c-green-text);
        }

        .when-card.avoid .when-card-title {
            color: var(--c-red-text);
        }

        .when-card ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .when-card ul li {
            font-size: 12px;
            color: var(--muted);
            display: flex;
            gap: 6px;
            align-items: flex-start;
            line-height: 1.45;
        }

        .when-card ul li::before {
            content: '→';
            flex-shrink: 0;
            opacity: .5;
        }

        /* How it works */
        .how-text {
            font-size: 13px;
            color: var(--muted);
            line-height: 1.75;
        }

        .how-text b {
            color: var(--text);
            font-weight: 600;
        }

        /* SVG shared */
        svg {
            display: block;
        }

        .search-result {
            font-size: 12px;
            color: var(--muted);
            text-align: center;
            min-height: 18px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Data Structures</h1>
        <span>Interactive Reference — 9 Core Structures</span>
    </header>

    <div class="layout">
        <nav class="sidebar">
            <div class="sidebar-title">Structures</div>
            <button class="ds-btn active" onclick="show('array')">
                <span class="icon icon-blue">[ ]</span>Array
            </button>
            <button class="ds-btn" onclick="show('ll')">
                <span class="icon icon-blue">◉→</span>Linked List
            </button>
            <button class="ds-btn" onclick="show('stack')">
                <span class="icon icon-amber">▤</span>Stack
            </button>
            <button class="ds-btn" onclick="show('queue')">
                <span class="icon icon-green">⇒</span>Queue
            </button>
            <button class="ds-btn" onclick="show('hm')">
                <span class="icon icon-blue">{}</span>Hashmap
            </button>
            <button class="ds-btn" onclick="show('heap')">
                <span class="icon icon-amber">△</span>Heap
            </button>
            <button class="ds-btn" onclick="show('tree')">
                <span class="icon icon-green">⊤</span>Tree (BST)
            </button>
            <button class="ds-btn" onclick="show('graph')">
                <span class="icon icon-blue">⬡</span>Graph
            </button>
            <button class="ds-btn" onclick="show('trie')">
                <span class="icon icon-amber">T.</span>Trie
            </button>
        </nav>

        <main class="main" id="main-content"></main>
    </div>

    <script>
        const DS = {
            array: {
                name: 'Array',
                tagline: 'Contiguous memory. Direct index access.',
                tags: ['Linear', 'Indexed', 'Static/Dynamic'],
                badgeClass: 'badge-blue',
                complexity: [
                    { label: 'Access', val: 'O(1)', cls: 'c-green' },
                    { label: 'Search', val: 'O(n)', cls: 'c-amber' },
                    { label: 'Insert end', val: 'O(1)*', cls: 'c-green' },
                    { label: 'Insert mid', val: 'O(n)', cls: 'c-amber' },
                    { label: 'Delete', val: 'O(n)', cls: 'c-amber' },
                    { label: 'Space', val: 'O(n)', cls: 'c-muted' },
                ],
                use: ['Index-based lookup needed', 'Iteration over all elements', 'Fixed-size or amortized growth', 'Cache-friendly operations'],
                avoid: ['Frequent mid insertions/deletions', 'Unknown or highly variable size', 'Need for fast search (use hashmap)'],
                how: 'Elements stored in <b>contiguous memory blocks</b>. Each element accessed via its index in O(1) because address = base + index × size. Inserting in the middle shifts all elements right — O(n). Dynamic arrays (like JS arrays, Python lists) double capacity when full, making push O(1) amortized.',
            },
            ll: {
                name: 'Linked List',
                tagline: 'Nodes with pointers. No index, just links.',
                tags: ['Linear', 'Pointer-based', 'Singly / Doubly'],
                badgeClass: 'badge-blue',
                complexity: [
                    { label: 'Access', val: 'O(n)', cls: 'c-amber' },
                    { label: 'Search', val: 'O(n)', cls: 'c-amber' },
                    { label: 'Insert head', val: 'O(1)', cls: 'c-green' },
                    { label: 'Insert tail', val: 'O(1)*', cls: 'c-green' },
                    { label: 'Delete head', val: 'O(1)', cls: 'c-green' },
                    { label: 'Space', val: 'O(n)', cls: 'c-muted' },
                ],
                use: ['Frequent insert/delete at head', 'Implementing stacks and queues', 'Memory fragmentation is acceptable', 'Unknown size that changes often'],
                avoid: ['Need random access by index', 'Cache performance is critical', 'Small data (pointer overhead dominates)'],
                how: 'Each <b>node</b> holds a value and a pointer to the next node. No contiguous memory — nodes can live anywhere. Traversal is always O(n). The key win: inserting or removing a node only requires updating 1–2 pointers, not shifting elements. A <b>doubly linked list</b> adds a prev pointer for O(1) removal given a node reference.',
            },
            stack: {
                name: 'Stack',
                tagline: 'LIFO — Last In, First Out.',
                tags: ['Linear', 'LIFO', 'Push/Pop'],
                badgeClass: 'badge-amber',
                complexity: [
                    { label: 'Push', val: 'O(1)', cls: 'c-green' },
                    { label: 'Pop', val: 'O(1)', cls: 'c-green' },
                    { label: 'Peek', val: 'O(1)', cls: 'c-green' },
                    { label: 'Search', val: 'O(n)', cls: 'c-amber' },
                    { label: 'Space', val: 'O(n)', cls: 'c-muted' },
                    { label: 'Empty?', val: 'O(1)', cls: 'c-green' },
                ],
                use: ['Undo/redo operations', 'Call stack in recursion', 'Matching brackets/parentheses', 'DFS traversal (explicit stack)', 'Expression evaluation'],
                avoid: ['Need FIFO ordering (use queue)', 'Need random access by index', 'Need to search efficiently'],
                how: 'Think of a stack of plates. You can only <b>push</b> (add to top) or <b>pop</b> (remove from top). All operations are O(1). The call stack in every programming language is literally a stack — when you call a function, a frame is pushed; when it returns, it\'s popped. The trick to many problems: when you need to "remember and undo" something, a stack is usually the answer.',
            },
            queue: {
                name: 'Queue',
                tagline: 'FIFO — First In, First Out.',
                tags: ['Linear', 'FIFO', 'Enqueue/Dequeue'],
                badgeClass: 'badge-green',
                complexity: [
                    { label: 'Enqueue', val: 'O(1)', cls: 'c-green' },
                    { label: 'Dequeue', val: 'O(1)', cls: 'c-green' },
                    { label: 'Peek', val: 'O(1)', cls: 'c-green' },
                    { label: 'Search', val: 'O(n)', cls: 'c-amber' },
                    { label: 'Space', val: 'O(n)', cls: 'c-muted' },
                    { label: 'Empty?', val: 'O(1)', cls: 'c-green' },
                ],
                use: ['BFS traversal', 'Job scheduling / task queues', 'Rate limiting / buffering', 'Printer queues, OS scheduling', 'Streaming data processing'],
                avoid: ['Need LIFO ordering (use stack)', 'Need priority ordering (use heap)', 'Need random access'],
                how: 'Like a line at a store: the first person in is the first out. Elements <b>enqueue</b> at the back and <b>dequeue</b> from the front. Typically implemented with a doubly linked list or circular buffer. Critical for <b>BFS</b> — you process nodes level by level by enqueueing neighbors and always dequeuing the oldest.',
            },
            hm: {
                name: 'Hashmap',
                tagline: 'Key → hash → bucket. O(1) average everything.',
                tags: ['Key-Value', 'Hash Function', 'O(1) avg'],
                badgeClass: 'badge-blue',
                complexity: [
                    { label: 'Get', val: 'O(1) avg', cls: 'c-green' },
                    { label: 'Set', val: 'O(1) avg', cls: 'c-green' },
                    { label: 'Delete', val: 'O(1) avg', cls: 'c-green' },
                    { label: 'Search (val)', val: 'O(n)', cls: 'c-amber' },
                    { label: 'Space', val: 'O(n)', cls: 'c-muted' },
                    { label: 'Worst case', val: 'O(n)', cls: 'c-red' },
                ],
                use: ['Fast key lookup (caching, memoization)', 'Counting frequency of elements', 'Detecting duplicates', 'Implementing sets', 'Graph adjacency lists'],
                avoid: ['Need ordered keys (use BST/sorted array)', 'Need insertion-order iteration (use ordered map)', 'Memory is extremely constrained'],
                how: 'A hash function converts a <b>key</b> into an index. That index points to a bucket in an array. O(1) average because we jump directly to the bucket. Two keys mapping to the same bucket = <b>collision</b>, resolved by chaining (linked list in bucket) or open addressing. When the load factor is too high, the table <b>rehashes</b> — doubles in size and reinserts all keys — O(n) but amortized.',
            },
            heap: {
                name: 'Heap',
                tagline: 'Complete binary tree. Parent always ≥ (or ≤) children.',
                tags: ['Tree-based', 'Min/Max heap', 'Priority Queue'],
                badgeClass: 'badge-amber',
                complexity: [
                    { label: 'Insert', val: 'O(log n)', cls: 'c-blue' },
                    { label: 'Get min/max', val: 'O(1)', cls: 'c-green' },
                    { label: 'Remove min/max', val: 'O(log n)', cls: 'c-blue' },
                    { label: 'Heapify', val: 'O(n)', cls: 'c-amber' },
                    { label: 'Space', val: 'O(n)', cls: 'c-muted' },
                    { label: 'Search', val: 'O(n)', cls: 'c-amber' },
                ],
                use: ['Priority queues (Dijkstra, A*)', 'Finding k-th largest/smallest', 'Heap sort', 'Scheduling with priorities', 'Median maintenance (two heaps)'],
                avoid: ['Need fast arbitrary key lookup', 'Need ordered traversal (use BST)', 'Need to search by value'],
                how: 'A <b>max-heap</b>: parent is always ≥ its children. Min is the same, inverted. Stored as a <b>compact array</b>: root at index 0, children of node i at 2i+1 and 2i+2. Insert at end, then <b>bubble up</b>. Remove root, move last element to root, then <b>sift down</b>. Both O(log n). The root always gives you the min or max instantly — that\'s the whole point.',
            },
            tree: {
                name: 'Tree (BST)',
                tagline: 'Hierarchical. Left < node < right.',
                tags: ['Hierarchical', 'BST', 'O(log n) avg'],
                badgeClass: 'badge-green',
                complexity: [
                    { label: 'Search', val: 'O(log n)*', cls: 'c-blue' },
                    { label: 'Insert', val: 'O(log n)*', cls: 'c-blue' },
                    { label: 'Delete', val: 'O(log n)*', cls: 'c-blue' },
                    { label: 'Min/Max', val: 'O(log n)*', cls: 'c-blue' },
                    { label: 'Space', val: 'O(n)', cls: 'c-muted' },
                    { label: 'Inorder', val: 'O(n)', cls: 'c-amber' },
                ],
                use: ['Ordered data with fast search', 'Range queries', 'Auto-complete / sorted sets', 'File systems, databases (B-trees)', 'In-order traversal gives sorted output'],
                avoid: ['Unbalanced trees degrade to O(n)', 'Pure key-value lookup (hashmap faster)', 'Memory constrained systems'],
                how: 'A <b>Binary Search Tree</b>: every node has at most 2 children. All left subtree values < node < all right subtree values. Search is O(log n) on a balanced tree because you halve the search space at each step. Insertion follows the same search path. In-order traversal (left → node → right) yields <b>sorted output</b>. Unbalanced trees degrade to O(n) — self-balancing trees like AVL or Red-Black fix this.',
            },
            graph: {
                name: 'Graph',
                tagline: 'Nodes (vertices) + edges. Directed or undirected.',
                tags: ['Nodes + Edges', 'BFS / DFS', 'Directed/Undirected'],
                badgeClass: 'badge-blue',
                complexity: [
                    { label: 'Add vertex', val: 'O(1)', cls: 'c-green' },
                    { label: 'Add edge', val: 'O(1)', cls: 'c-green' },
                    { label: 'BFS/DFS', val: 'O(V+E)', cls: 'c-amber' },
                    { label: 'Space (adj list)', val: 'O(V+E)', cls: 'c-muted' },
                    { label: 'Space (matrix)', val: 'O(V²)', cls: 'c-red' },
                    { label: 'Shortest path', val: 'O((V+E)logV)', cls: 'c-blue' },
                ],
                use: ['Social networks (friends of friends)', 'Navigation / shortest path (Dijkstra)', 'Dependencies (topological sort)', 'Web crawlers', 'Network flow, scheduling'],
                avoid: ['Hierarchical data with no cycles (use tree)', 'Simple lookups (use hashmap)', 'Ordered data (use BST)'],
                how: 'A graph has <b>vertices</b> (nodes) and <b>edges</b> (connections). Directed = edges have direction. Weighted = edges have costs. Stored as an <b>adjacency list</b> (each node stores its neighbors — efficient for sparse graphs) or <b>adjacency matrix</b> (2D array — efficient for dense graphs or fast edge lookup). Traversal: BFS finds shortest paths (unweighted), DFS explores depth-first. Dijkstra\'s algorithm finds shortest weighted paths.',
            },
            trie: {
                name: 'Trie',
                tagline: 'Prefix tree. Each path spells a word.',
                tags: ['Tree-based', 'Prefix', 'String search'],
                badgeClass: 'badge-amber',
                complexity: [
                    { label: 'Insert', val: 'O(m)', cls: 'c-green' },
                    { label: 'Search', val: 'O(m)', cls: 'c-green' },
                    { label: 'Prefix search', val: 'O(m)', cls: 'c-green' },
                    { label: 'Delete', val: 'O(m)', cls: 'c-green' },
                    { label: 'Space', val: 'O(A × n × m)', cls: 'c-muted' },
                    { label: '(m = word len)', val: '', cls: 'c-muted' },
                ],
                use: ['Autocomplete / type-ahead search', 'Spell checkers', 'IP routing tables', 'Dictionary word validation', 'Finding all words with a prefix'],
                avoid: ['Single exact-match lookup (use hashmap)', 'Non-string keys', 'Memory is constrained (lots of nodes)'],
                how: 'A trie is a tree where each <b>edge represents a character</b>. To store "CAT", you traverse root → C → A → T, marking T as a terminal node. Searching for a word or prefix takes O(m) where m = word length — independent of how many words are stored. This makes tries massively efficient for <b>prefix-based queries</b>. Each node can have up to 26 children (one per letter). Common optimization: compressed tries merge single-child nodes.',
            },
        };

        // Mutable state
        const state = {
            array: { items: [3, 7, 12, 5, 9, 1], highlight: -1, newIdx: -1 },
            ll: { items: [4, 8, 15, 16, 23], highlighted: null },
            stack: { items: ['main()', 'foo()', 'bar()'] },
            queue: { items: [10, 20, 30, 40] },
            hm: { buckets: [['a:1', 'c:3'], ['b:2'], ['d:4'], [], ['e:5', 'f:6']], lastBucket: -1 },
            heap: { items: [42, 28, 35, 12, 18, 20, 8] },
            tree: { highlighted: null },
            graph: { highlighted: null },
            trie: { searchResult: '' },
        };

        let currentKey = 'array';

        function getComplexityClass(val) {
            if (!val) return 'c-muted';
            if (val.startsWith('O(1)')) return 'c-green';
            if (val.includes('log')) return 'c-blue';
            if (val.startsWith('O(n)')) return 'c-amber';
            if (val.includes('n²') || val.includes('n^') || val.includes('V²')) return 'c-red';
            return 'c-muted';
        }

        function show(key) {
            currentKey = key;
            document.querySelectorAll('.ds-btn').forEach(b => b.classList.remove('active'));
            const keys = ['array', 'll', 'stack', 'queue', 'hm', 'heap', 'tree', 'graph', 'trie'];
            document.querySelectorAll('.ds-btn')[keys.indexOf(key)]?.classList.add('active');

            const ds = DS[key];
            const main = document.getElementById('main-content');

            const complexityHTML = ds.complexity.map(c => `
    <div class="complexity-card">
      <div class="complexity-label">${c.label}</div>
      <div class="complexity-val ${c.cls || getComplexityClass(c.val)}">${c.val || '—'}</div>
    </div>
  `).join('');

            const useHTML = ds.use.map(u => `<li>${u}</li>`).join('');
            const avoidHTML = ds.avoid.map(a => `<li>${a}</li>`).join('');

            main.innerHTML = `
    <div>
      <div class="ds-name">${ds.name}</div>
      <div class="ds-tagline">${ds.tagline}</div>
      <div class="tag-row">${ds.tags.map(t => `<span class="badge ${ds.badgeClass}">${t}</span>`).join('')}</div>
    </div>
    <div class="divider"></div>
    <div>
      <div class="section-title">Time &amp; Space complexity</div>
      <div class="complexity-grid" style="margin-top:10px">${complexityHTML}</div>
    </div>
    <div class="divider"></div>
    <div>
      <div class="section-title">Interactive</div>
      <div class="viz-area" id="viz-inner" style="margin-top:10px"></div>
    </div>
    <div class="divider"></div>
    <div>
      <div class="section-title">When to use / avoid</div>
      <div class="when-grid" style="margin-top:10px">
        <div class="when-card use">
          <div class="when-card-title">Use when</div>
          <ul>${useHTML}</ul>
        </div>
        <div class="when-card avoid">
          <div class="when-card-title">Avoid when</div>
          <ul>${avoidHTML}</ul>
        </div>
      </div>
    </div>
    <div class="divider"></div>
    <div>
      <div class="section-title">How it works</div>
      <div class="how-text" style="margin-top:8px">${ds.how}</div>
    </div>
  `;

            renderViz(key);
        }

        function renderViz(key) {
            const c = document.getElementById('viz-inner');
            if (!c) return;
            c.innerHTML = '';

            /* ---- ARRAY ---- */
            if (key === 'array') {
                const row = document.createElement('div');
                row.className = 'node-row';
                state.array.items.forEach((v, i) => {
                    const cell = document.createElement('div');
                    cell.className = 'array-cell' +
                        (i === state.array.highlight ? ' highlight' : '') +
                        (i === state.array.newIdx ? ' new-item' : '');
                    cell.textContent = v;
                    const idx = document.createElement('span');
                    idx.className = 'idx';
                    idx.textContent = i;
                    cell.appendChild(idx);
                    cell.onclick = () => {
                        state.array.highlight = state.array.highlight === i ? -1 : i;
                        state.array.newIdx = -1;
                        renderViz('array');
                    };
                    row.appendChild(cell);
                });
                c.appendChild(row);

                const label = document.createElement('div');
                label.className = 'viz-label';
                label.textContent = 'Click a cell to highlight it';
                c.appendChild(label);

                const ctrl = document.createElement('div');
                ctrl.className = 'viz-controls';
                const inp = mkInput('number', 'value');
                const pushBtn = mkBtn('Push', () => {
                    const v = parseInt(inp.value) || Math.floor(Math.random() * 99 + 1);
                    state.array.items.push(v);
                    state.array.newIdx = state.array.items.length - 1;
                    state.array.highlight = -1;
                    inp.value = '';
                    renderViz('array');
                });
                const popBtn = mkBtn('Pop', () => {
                    if (state.array.items.length > 0) {
                        state.array.items.pop();
                        state.array.highlight = -1;
                        state.array.newIdx = -1;
                        renderViz('array');
                    }
                });
                ctrl.appendChild(inp); ctrl.appendChild(pushBtn); ctrl.appendChild(popBtn);
                c.appendChild(ctrl);
            }

            /* ---- LINKED LIST ---- */
            if (key === 'll') {
                const row = document.createElement('div');
                row.className = 'll-row';
                state.ll.items.forEach((v, i) => {
                    const node = document.createElement('div');
                    node.className = 'll-node';
                    const box = document.createElement('div');
                    box.className = 'll-box' + (state.ll.highlighted === i ? ' highlight' : '');
                    box.innerHTML = `<span>${v}</span><span class="ptr">${i === state.ll.items.length - 1 ? 'null' : 'ptr→'}</span>`;
                    box.onclick = () => {
                        state.ll.highlighted = state.ll.highlighted === i ? null : i;
                        renderViz('ll');
                    };
                    node.appendChild(box);
                    if (i < state.ll.items.length - 1) {
                        const arr = document.createElement('div');
                        arr.className = 'll-arrow';
                        arr.textContent = '→';
                        node.appendChild(arr);
                    }
                    row.appendChild(node);
                });
                c.appendChild(row);

                const ctrl = document.createElement('div');
                ctrl.className = 'viz-controls';
                const inp = mkInput('number', 'value');
                ctrl.appendChild(inp);
                ctrl.appendChild(mkBtn('Prepend O(1)', () => {
                    const v = parseInt(inp.value) || Math.floor(Math.random() * 99 + 1);
                    state.ll.items.unshift(v);
                    inp.value = '';
                    state.ll.highlighted = 0;
                    renderViz('ll');
                }));
                ctrl.appendChild(mkBtn('Append O(1)', () => {
                    const v = parseInt(inp.value) || Math.floor(Math.random() * 99 + 1);
                    state.ll.items.push(v);
                    inp.value = '';
                    state.ll.highlighted = state.ll.items.length - 1;
                    renderViz('ll');
                }));
                ctrl.appendChild(mkBtn('Remove head', () => {
                    if (state.ll.items.length > 0) { state.ll.items.shift(); state.ll.highlighted = null; renderViz('ll'); }
                }));
                c.appendChild(ctrl);
            }

            /* ---- STACK ---- */
            if (key === 'stack') {
                const col = document.createElement('div');
                col.className = 'stack-col';
                const topLbl = document.createElement('div');
                topLbl.className = 'stack-top-label';
                topLbl.textContent = '← top';
                col.appendChild(topLbl);
                [...state.stack.items].reverse().forEach((v, i) => {
                    const cell = document.createElement('div');
                    cell.className = 'stack-cell' + (i === 0 ? ' top-item' : '');
                    cell.textContent = v;
                    col.appendChild(cell);
                });
                c.appendChild(col);

                const ctrl = document.createElement('div');
                ctrl.className = 'viz-controls';
                ctrl.style.marginTop = '10px';
                const inp = mkInput('text', 'label');
                inp.style.width = '90px';
                ctrl.appendChild(inp);
                ctrl.appendChild(mkBtn('Push O(1)', () => {
                    const v = inp.value || 'fn()';
                    state.stack.items.push(v);
                    inp.value = '';
                    renderViz('stack');
                }));
                ctrl.appendChild(mkBtn('Pop O(1)', () => {
                    if (state.stack.items.length > 0) { state.stack.items.pop(); renderViz('stack'); }
                }));
                c.appendChild(ctrl);
            }

            /* ---- QUEUE ---- */
            if (key === 'queue') {
                const row = document.createElement('div');
                row.className = 'queue-row';
                state.queue.items.forEach((v, i) => {
                    const cell = document.createElement('div');
                    cell.className = 'queue-cell';
                    const span = document.createElement('span');
                    span.textContent = v;
                    cell.appendChild(span);
                    if (i === 0) {
                        const l = document.createElement('span'); l.className = 'qlabel'; l.textContent = 'front'; cell.appendChild(l);
                    }
                    if (i === state.queue.items.length - 1) {
                        const l = document.createElement('span'); l.className = 'qlabel'; l.textContent = 'back'; cell.appendChild(l);
                    }
                    row.appendChild(cell);
                });
                c.appendChild(row);

                const ctrl = document.createElement('div');
                ctrl.className = 'viz-controls';
                ctrl.style.marginTop = '10px';
                const inp = mkInput('number', 'value');
                ctrl.appendChild(inp);
                ctrl.appendChild(mkBtn('Enqueue O(1)', () => {
                    const v = parseInt(inp.value) || Math.floor(Math.random() * 99 + 1);
                    state.queue.items.push(v);
                    inp.value = '';
                    renderViz('queue');
                }));
                ctrl.appendChild(mkBtn('Dequeue O(1)', () => {
                    if (state.queue.items.length > 0) { state.queue.items.shift(); renderViz('queue'); }
                }));
                c.appendChild(ctrl);
            }

            /* ---- HASHMAP ---- */
            if (key === 'hm') {
                const grid = document.createElement('div');
                grid.className = 'hm-grid';
                state.hm.buckets.forEach((bucket, i) => {
                    const row = document.createElement('div');
                    row.className = 'hm-row';
                    const lbl = document.createElement('div');
                    lbl.className = 'hm-bucket-label';
                    lbl.textContent = i;
                    const bkt = document.createElement('div');
                    bkt.className = 'hm-bucket';
                    bucket.forEach((item, j) => {
                        const it = document.createElement('div');
                        it.className = 'hm-item' + (j === bucket.length - 1 && state.hm.lastBucket === i ? ' new-item' : '');
                        it.textContent = item;
                        bkt.appendChild(it);
                    });
                    row.appendChild(lbl); row.appendChild(bkt);
                    grid.appendChild(row);
                });
                c.appendChild(grid);

                const ctrl = document.createElement('div');
                ctrl.className = 'viz-controls';
                ctrl.style.marginTop = '8px';
                const kInp = mkInput('text', 'key');
                kInp.style.width = '52px';
                const vInp = mkInput('text', 'val');
                vInp.style.width = '52px';
                ctrl.appendChild(kInp); ctrl.appendChild(vInp);
                ctrl.appendChild(mkBtn('Set O(1)', () => {
                    const k = kInp.value || String.fromCharCode(65 + Math.floor(Math.random() * 26));
                    const v = vInp.value || Math.floor(Math.random() * 99 + 1);
                    const bi = k.charCodeAt(0) % state.hm.buckets.length;
                    state.hm.buckets[bi].push(`${k}:${v}`);
                    state.hm.lastBucket = bi;
                    kInp.value = ''; vInp.value = '';
                    renderViz('hm');
                }));
                c.appendChild(ctrl);
            }

            /* ---- HEAP ---- */
            if (key === 'heap') {
                const items = state.heap.items;
                const W = 300, gx = 60, gy = 60;
                const positions = [];
                [[0], [1, 2], [3, 4, 5, 6]].forEach((row, ri) => {
                    const total = row.length;
                    const startX = (W - (total - 1) * gx) / 2;
                    row.forEach((idx, ci) => {
                        positions[idx] = { x: startX + ci * gx, y: 28 + ri * gy };
                    });
                });

                const svg = mkSVG(W, 185);
                [[0, 1], [0, 2], [1, 3], [1, 4], [2, 5], [2, 6]].forEach(([p, ch]) => {
                    if (positions[p] && positions[ch]) {
                        const line = svgEl('line');
                        line.setAttribute('x1', positions[p].x); line.setAttribute('y1', positions[p].y);
                        line.setAttribute('x2', positions[ch].x); line.setAttribute('y2', positions[ch].y);
                        line.setAttribute('stroke', 'var(--border-strong)'); line.setAttribute('stroke-width', '1');
                        svg.appendChild(line);
                    }
                });

                items.forEach((v, i) => {
                    if (!positions[i]) return;
                    const g = svgEl('g');
                    const circle = svgEl('circle');
                    circle.setAttribute('cx', positions[i].x); circle.setAttribute('cy', positions[i].y); circle.setAttribute('r', 20);
                    circle.setAttribute('stroke', 'var(--border-strong)'); circle.setAttribute('stroke-width', '0.5');
                    circle.setAttribute('fill', i === 0 ? 'var(--c-amber-bg)' : i < 3 ? 'var(--c-blue-bg)' : 'var(--surface)');
                    const text = svgEl('text');
                    text.setAttribute('x', positions[i].x); text.setAttribute('y', positions[i].y);
                    text.setAttribute('text-anchor', 'middle'); text.setAttribute('dominant-baseline', 'central');
                    text.setAttribute('font-size', '13'); text.setAttribute('font-weight', '600');
                    text.setAttribute('font-family', "'JetBrains Mono', monospace");
                    text.setAttribute('fill', i === 0 ? 'var(--c-amber-text)' : i < 3 ? 'var(--c-blue-text)' : 'var(--text)');
                    text.textContent = v;
                    g.appendChild(circle); g.appendChild(text);
                    svg.appendChild(g);
                });
                c.appendChild(svg);

                const ctrl = document.createElement('div');
                ctrl.className = 'viz-controls';
                const inp = mkInput('number', 'value');
                ctrl.appendChild(inp);
                ctrl.appendChild(mkBtn('Insert O(log n)', () => {
                    const v = parseInt(inp.value) || Math.floor(Math.random() * 99 + 1);
                    inp.value = '';
                    if (state.heap.items.length < 7) {
                        state.heap.items.push(v);
                        let i = state.heap.items.length - 1;
                        while (i > 0) {
                            const p = Math.floor((i - 1) / 2);
                            if (state.heap.items[p] < state.heap.items[i]) {
                                [state.heap.items[p], state.heap.items[i]] = [state.heap.items[i], state.heap.items[p]];
                                i = p;
                            } else break;
                        }
                        renderViz('heap');
                    }
                }));
                ctrl.appendChild(mkBtn('Remove max O(log n)', () => {
                    if (state.heap.items.length === 0) return;
                    state.heap.items[0] = state.heap.items.pop();
                    let i = 0;
                    while (true) {
                        const l = 2 * i + 1, r = 2 * i + 2; let max = i;
                        if (l < state.heap.items.length && state.heap.items[l] > state.heap.items[max]) max = l;
                        if (r < state.heap.items.length && state.heap.items[r] > state.heap.items[max]) max = r;
                        if (max === i) break;
                        [state.heap.items[i], state.heap.items[max]] = [state.heap.items[max], state.heap.items[i]];
                        i = max;
                    }
                    renderViz('heap');
                }));
                c.appendChild(ctrl);
            }

            /* ---- TREE (BST) ---- */
            if (key === 'tree') {
                const nodes = [
                    { v: 50, x: 145, y: 20 }, { v: 30, x: 75, y: 75 }, { v: 70, x: 215, y: 75 },
                    { v: 20, x: 40, y: 130 }, { v: 40, x: 110, y: 130 }, { v: 60, x: 180, y: 130 }, { v: 80, x: 250, y: 130 }
                ];
                const W = 290, H = 170;
                const svg = mkSVG(W, H);

                [[0, 1], [0, 2], [1, 3], [1, 4], [2, 5], [2, 6]].forEach(([p, ch]) => {
                    const line = svgEl('line');
                    line.setAttribute('x1', nodes[p].x + 18); line.setAttribute('y1', nodes[p].y + 18);
                    line.setAttribute('x2', nodes[ch].x + 18); line.setAttribute('y2', nodes[ch].y + 18);
                    line.setAttribute('stroke', 'var(--border-strong)'); line.setAttribute('stroke-width', '1');
                    svg.appendChild(line);
                });

                nodes.forEach((n, i) => {
                    const g = svgEl('g');
                    g.style.cursor = 'pointer';
                    const circle = svgEl('circle');
                    circle.setAttribute('cx', n.x + 18); circle.setAttribute('cy', n.y + 18); circle.setAttribute('r', 18);
                    circle.setAttribute('stroke', 'var(--border-strong)'); circle.setAttribute('stroke-width', '0.5');
                    circle.setAttribute('fill',
                        i === 0 ? 'var(--c-green-bg)' :
                            state.tree.highlighted === i ? 'var(--c-blue-bg)' : 'var(--surface)');
                    const text = svgEl('text');
                    text.setAttribute('x', n.x + 18); text.setAttribute('y', n.y + 18);
                    text.setAttribute('text-anchor', 'middle'); text.setAttribute('dominant-baseline', 'central');
                    text.setAttribute('font-size', '12'); text.setAttribute('font-weight', '600');
                    text.setAttribute('font-family', "'JetBrains Mono', monospace");
                    text.setAttribute('fill',
                        i === 0 ? 'var(--c-green-text)' :
                            state.tree.highlighted === i ? 'var(--c-blue-text)' : 'var(--text)');
                    text.textContent = n.v;
                    g.appendChild(circle); g.appendChild(text);
                    g.onclick = () => { state.tree.highlighted = state.tree.highlighted === i ? null : i; renderViz('tree'); };
                    svg.appendChild(g);
                });
                c.appendChild(svg);

                const info = document.createElement('div');
                info.className = 'viz-label';
                info.textContent = 'Root (50) in green. Left subtree < 50 < right subtree. Click any node to highlight.';
                c.appendChild(info);
            }

            /* ---- GRAPH ---- */
            if (key === 'graph') {
                const nodes = [{ id: 'A', x: 100, y: 40 }, { id: 'B', x: 200, y: 40 }, { id: 'C', x: 50, y: 120 }, { id: 'D', x: 150, y: 120 }, { id: 'E', x: 240, y: 120 }];
                const edges = [['A', 'B'], ['A', 'C'], ['A', 'D'], ['B', 'D'], ['B', 'E'], ['C', 'D'], ['D', 'E']];
                const W = 290, H = 165;
                const svg = mkSVG(W, H);
                const nodeMap = {};
                nodes.forEach(n => nodeMap[n.id] = n);

                const edgeEls = [];
                edges.forEach(([a, b]) => {
                    const line = svgEl('line');
                    line.setAttribute('x1', nodeMap[a].x); line.setAttribute('y1', nodeMap[a].y);
                    line.setAttribute('x2', nodeMap[b].x); line.setAttribute('y2', nodeMap[b].y);
                    line.setAttribute('stroke', 'var(--border-strong)'); line.setAttribute('stroke-width', '1.5');
                    line.dataset.a = a; line.dataset.b = b;
                    svg.appendChild(line);
                    edgeEls.push(line);
                });

                const circleEls = {}, textEls = {};
                nodes.forEach(n => {
                    const g = svgEl('g');
                    g.style.cursor = 'pointer';
                    const circle = svgEl('circle');
                    circle.setAttribute('cx', n.x); circle.setAttribute('cy', n.y); circle.setAttribute('r', 20);
                    circle.setAttribute('stroke', 'var(--border-strong)'); circle.setAttribute('stroke-width', '0.5');
                    circle.setAttribute('fill', 'var(--surface)');
                    const text = svgEl('text');
                    text.setAttribute('x', n.x); text.setAttribute('y', n.y);
                    text.setAttribute('text-anchor', 'middle'); text.setAttribute('dominant-baseline', 'central');
                    text.setAttribute('font-size', '13'); text.setAttribute('font-weight', '600');
                    text.setAttribute('font-family', "'JetBrains Mono', monospace");
                    text.setAttribute('fill', 'var(--text)');
                    text.textContent = n.id;
                    g.appendChild(circle); g.appendChild(text);
                    circleEls[n.id] = circle; textEls[n.id] = text;
                    g.onclick = () => {
                        const isHl = circle.getAttribute('fill').includes('blue');
                        nodes.forEach(nn => {
                            circleEls[nn.id].setAttribute('fill', 'var(--surface)');
                            textEls[nn.id].setAttribute('fill', 'var(--text)');
                        });
                        edgeEls.forEach(el => el.setAttribute('stroke', 'var(--border-strong)'));
                        if (!isHl) {
                            circle.setAttribute('fill', 'var(--c-blue-bg)');
                            text.setAttribute('fill', 'var(--c-blue-text)');
                            edgeEls.forEach(el => {
                                if (el.dataset.a === n.id || el.dataset.b === n.id) el.setAttribute('stroke', 'var(--c-blue-text)');
                            });
                        }
                    };
                    svg.appendChild(g);
                });
                c.appendChild(svg);

                const info = document.createElement('div');
                info.className = 'viz-label';
                info.textContent = 'Click a node to highlight its edges. Undirected, unweighted graph.';
                c.appendChild(info);
            }

            /* ---- TRIE ---- */
            if (key === 'trie') {
                const words = ['CAR', 'CAT', 'CART', 'CARD', 'BAT', 'BAR', 'BAN'];
                const trie = {};
                words.forEach(w => {
                    let n = trie;
                    for (const ch of w) { if (!n[ch]) n[ch] = {}; n = n[ch]; }
                    n['$'] = true;
                });

                const W = 320, H = 200;
                const svg = mkSVG(W, H);
                const nodePositions = [];
                const rootX = 160, rootY = 20;

                function layout(node, x, y, spread) {
                    const keys = Object.keys(node).filter(k => k !== '$');
                    keys.forEach((k, i) => {
                        const nx = x + (i - (keys.length - 1) / 2) * spread;
                        const ny = y + 52;
                        nodePositions.push({ label: k, x: nx, y: ny, end: !!node[k]['$'], parentX: x, parentY: y });
                        layout(node[k], nx, ny, spread * 0.65);
                    });
                }

                layout(trie, rootX, rootY, 70);

                nodePositions.forEach(n => {
                    const line = svgEl('line');
                    line.setAttribute('x1', n.parentX); line.setAttribute('y1', n.parentY);
                    line.setAttribute('x2', n.x); line.setAttribute('y2', n.y);
                    line.setAttribute('stroke', 'var(--border-strong)'); line.setAttribute('stroke-width', '1');
                    svg.appendChild(line);
                });

                // Root
                const rc = svgEl('circle');
                rc.setAttribute('cx', rootX); rc.setAttribute('cy', rootY); rc.setAttribute('r', 14);
                rc.setAttribute('fill', 'var(--surface)'); rc.setAttribute('stroke', 'var(--border-strong)'); rc.setAttribute('stroke-width', '0.5');
                const rt = svgEl('text');
                rt.setAttribute('x', rootX); rt.setAttribute('y', rootY);
                rt.setAttribute('text-anchor', 'middle'); rt.setAttribute('dominant-baseline', 'central');
                rt.setAttribute('font-size', '10'); rt.setAttribute('fill', 'var(--muted)');
                rt.setAttribute('font-family', "var(--sans)");
                rt.textContent = 'root';
                svg.appendChild(rc); svg.appendChild(rt);

                nodePositions.forEach(n => {
                    const g = svgEl('g');
                    const circle = svgEl('circle');
                    circle.setAttribute('cx', n.x); circle.setAttribute('cy', n.y); circle.setAttribute('r', 14);
                    circle.setAttribute('stroke', 'var(--border-strong)'); circle.setAttribute('stroke-width', '0.5');
                    circle.setAttribute('fill', n.end ? 'var(--c-green-bg)' : 'var(--surface)');
                    const text = svgEl('text');
                    text.setAttribute('x', n.x); text.setAttribute('y', n.y);
                    text.setAttribute('text-anchor', 'middle'); text.setAttribute('dominant-baseline', 'central');
                    text.setAttribute('font-size', '12'); text.setAttribute('font-weight', '600');
                    text.setAttribute('font-family', "'JetBrains Mono', monospace");
                    text.setAttribute('fill', n.end ? 'var(--c-green-text)' : 'var(--text)');
                    text.textContent = n.label;
                    g.appendChild(circle); g.appendChild(text);
                    svg.appendChild(g);
                });

                c.appendChild(svg);

                const legend = document.createElement('div');
                legend.className = 'viz-label';
                legend.textContent = 'Green = end of word. Stored: ' + words.join(', ');
                c.appendChild(legend);

                const ctrl = document.createElement('div');
                ctrl.className = 'viz-controls';
                const sinp = mkInput('text', 'prefix');
                sinp.style.width = '80px';
                const resultDiv = document.createElement('div');
                resultDiv.className = 'search-result';

                ctrl.appendChild(sinp);
                ctrl.appendChild(mkBtn('Find words', () => {
                    const p = sinp.value.toUpperCase().trim();
                    if (!p) { resultDiv.textContent = ''; return; }
                    const found = words.filter(w => w.startsWith(p));
                    resultDiv.textContent = found.length ? `Words with "${p}": ${found.join(', ')}` : `No words start with "${p}"`;
                }));
                c.appendChild(ctrl);
                c.appendChild(resultDiv);
            }
        }

        /* ---- helpers ---- */
        function mkBtn(label, handler) {
            const b = document.createElement('button');
            b.className = 'viz-btn';
            b.textContent = label;
            b.onclick = handler;
            return b;
        }

        function mkInput(type, placeholder) {
            const inp = document.createElement('input');
            inp.className = 'viz-input';
            inp.type = type;
            inp.placeholder = placeholder;
            return inp;
        }

        function mkSVG(w, h) {
            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
            svg.style.width = '100%';
            svg.style.maxWidth = w + 'px';
            return svg;
        }

        function svgEl(tag) {
            return document.createElementNS('http://www.w3.org/2000/svg', tag);
        }

        // Init
        show('array');
    </script>
</body>

</html>
